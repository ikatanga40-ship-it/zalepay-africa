<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniPay Africa</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://unpkg.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 font-sans">
  <div class="max-w-lg mx-auto space-y-4">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">OmniPay Africa</h1>
        <p class="text-xs text-slate-400">Swap • Gift Cards • Bills • Safe-Claim • Split</p>
      </div>
      <button id="connectBtn" type="button" onclick="connectWallet()" class="bg-emerald-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl">Connect Wallet</button>
    </div>

    <div class="grid grid-cols-2 gap-2 bg-slate-900 p-3 rounded-xl border border-slate-800">
      <select id="country" onchange="setCountry()" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs">
        <option value="NG">Nigeria (NGN ₦)</option>
        <option value="ZM">Zambia (ZMW K)</option>
        <option value="KE">Kenya (KES KSh)</option>
        <option value="GH">Ghana (GHS ₵)</option>
        <option value="ZA">South Africa (ZAR R)</option>
      </select>
      <input id="router" type="text" placeholder="0x... OmniPayRouter" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-emerald-300" />
    </div>

    <div class="grid grid-cols-5 gap-1 bg-slate-900 p-1 rounded-xl text-xs font-semibold">
      <button type="button" onclick="tab('swap')" id="b-swap" class="py-2 rounded-lg bg-emerald-500 text-slate-950">Swap</button>
      <button type="button" onclick="tab('card')" id="b-card" class="py-2 rounded-lg text-slate-400">Cards</button>
      <button type="button" onclick="tab('bill')" id="b-bill" class="py-2 rounded-lg text-slate-400">Bills</button>
      <button type="button" onclick="tab('safe')" id="b-safe" class="py-2 rounded-lg text-slate-400">Safe-PIN</button>
      <button type="button" onclick="tab('split')" id="b-split" class="py-2 rounded-lg text-slate-400">Split</button>
    </div>

    <div id="p-swap" class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
      <h2 class="font-semibold text-sm">Crypto Swap & Local Cashout</h2>
      <div class="grid grid-cols-2 gap-2">
        <select id="sAsset" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs"><option>USDT</option><option>USDC</option><option>ETH</option></select>
        <select id="sRail" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs"></select>
      </div>
      <input id="sAmt" oninput="calc()" type="number" placeholder="Amount (USD)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      <input id="sDest" type="text" placeholder="Bank Account / Mobile Money Number" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      <p id="sEst" class="text-xs text-emerald-400">Payout: 0</p>
      <button type="button" onclick="logOrder('Swap / Cashout')" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs">Execute Swap</button>
    </div>

    <div id="p-card" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
      <h2 class="font-semibold text-sm">Trade Gift Cards for Cash or USDT</h2>
      <select id="cBrand" onchange="calc()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs">
        <option value="0.82">Amazon US (82%)</option><option value="0.80">Apple / iTunes (80%)</option><option value="0.84">Steam Wallet (84%)</option><option value="0.85">Razer Gold (85%)</option>
      </select>
      <div class="grid grid-cols-2 gap-2">
        <input id="cVal" oninput="calc()" type="number" placeholder="Card USD ($)" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
        <input id="cPin" type="text" placeholder="Card E-Code / PIN" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      </div>
      <p id="cEst" class="text-xs text-emerald-400">Receive: 0</p>
      <button type="button" onclick="logOrder('Gift Card Trade')" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs">Submit Gift Card</button>
    </div>

    <div id="p-bill" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
      <h2 class="font-semibold text-sm">Pay Airtime & Utility Bills</h2>
      <select id="bProv" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs"></select>
      <div class="grid grid-cols-2 gap-2">
        <input id="bNum" type="text" placeholder="Phone / Meter Number" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
        <input id="bAmt" type="number" placeholder="Amount (USDC)" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      </div>
      <button type="button" onclick="logOrder('Bill Payment')" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs">Pay Bill</button>
    </div>

    <div id="p-safe" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
      <h2 class="font-semibold text-sm">Safe-Claim 4-Digit PIN Link</h2>
      <input id="eTok" type="text" placeholder="Token Address (0x...)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      <div class="grid grid-cols-2 gap-2">
        <input id="eAmt" type="number" placeholder="Amount" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
        <input id="ePin" type="text" placeholder="4-Digit PIN" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      </div>
      <button type="button" onclick="runEscrow()" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs">Lock & Create PIN Link</button>
    </div>

    <div id="p-split" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
      <h2 class="font-semibold text-sm">Multi-Wallet Auto-Split</h2>
      <input id="spTok" type="text" placeholder="Token Address (0x...)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      <input id="spRec" type="text" placeholder="Wallets: 0x1..., 0x2..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      <input id="spAmt" type="text" placeholder="Amounts: 70, 30" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" />
      <button type="button" onclick="runSplit()" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs">Send Split</button>
    </div>

    <div id="msg" class="hidden p-3 rounded-xl bg-slate-900 border border-emerald-500/40 text-xs text-emerald-300 break-all"></div>
  </div>

  <script>
    const DATA = {
      NG: { s: "₦", r: 1620, rails: ["OPay / PalmPay", "Nigerian Bank", "USDT"], bills: ["MTN NG", "Airtel NG", "IKEDC / EKEDC Power", "DStv NG"] },
      ZM: { s: "K", r: 27.5, rails: ["MTN MoMo", "Airtel Money", "Zanaco / FNB", "USDT"], bills: ["MTN ZM", "Airtel ZM", "ZESCO Power", "DStv ZM"] },
      KE: { s: "KSh", r: 129, rails: ["M-Pesa", "Airtel Money", "KCB / Equity", "USDT"], bills: ["Safaricom", "Airtel KE", "KPLC Power", "DStv KE"] },
      GH: { s: "₵", r: 15.8, rails: ["MTN MoMo GH", "Telecel Cash", "GCB Bank", "USDT"], bills: ["MTN GH", "Telecel GH", "ECG Power", "DStv GH"] },
      ZA: { s: "R", r: 18.2, rails: ["FNB / Capitec", "Standard Bank", "USDT"], bills: ["Vodacom / MTN", "Eskom Power", "DStv SA"] }
    };
    const ABI = [
      "function createEscrow(address token, uint256 amount, bytes32 secretHash, uint256 durationSeconds) external returns (bytes32)",
      "function splitTransfer(address token, address[] calldata recipients, uint256[] calldata amounts) external"
    ];
    const ERC20 = ["function approve(address spender, uint256 amount) external returns (bool)", "function decimals() external view returns (uint8)"];
    let signer;

    function setCountry() {
      const d = DATA[document.getElementById('country').value];
      document.getElementById('sRail').innerHTML = d.rails.map(x => `<option>${x}</option>`).join('');
      document.getElementById('bProv').innerHTML = d.bills.map(x => `<option>${x}</option>`).join('');
      calc();
    }
    function calc() {
      const d = DATA[document.getElementById('country').value];
      const sa = parseFloat(document.getElementById('sAmt').value) || 0;
      document.getElementById('sEst').textContent = `Payout: ${d.s}${(sa * d.r).toLocaleString()} ($${sa} USDT)`;
      const cv = (parseFloat(document.getElementById('cVal').value) || 0) * (parseFloat(document.getElementById('cBrand').value) || 0.8);
      document.getElementById('cEst').textContent = `Receive: $${cv.toFixed(2)} USDT (${d.s}${(cv * d.r).toLocaleString()})`;
    }
    function tab(t) {
      ['swap','card','bill','safe','split'].forEach(x => {
        document.getElementById('p-'+x).classList.toggle('hidden', x !== t);
        document.getElementById('b-'+x).className = x === t ? 'py-2 rounded-lg bg-emerald-500 text-slate-950' : 'py-2 rounded-lg text-slate-400';
      });
    }
    function say(t) { const m = document.getElementById('msg'); m.textContent = t; m.classList.remove('hidden'); }

    async function connectWallet() {
      try {
        if (!window.ethereum) return say("Open in Chrome with MetaMask installed.");
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        const p = new ethers.BrowserProvider(window.ethereum);
        signer = await p.getSigner();
        const a = await signer.getAddress();
        document.getElementById('connectBtn').textContent = a.slice(0,6) + '...' + a.slice(-4);
        say("Wallet connected: " + a);
      } catch (e) { say("Error: " + (e.shortMessage || e.message)); }
